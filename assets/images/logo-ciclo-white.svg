    <!-- Biocarvão Facetado -->
    <g transform="translate(85, 138)">
      <polygon points="-75,18 -58,-22 -18,-28 2,-5 -15,35 -58,38" fill="#18181B" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>
      <polyline points="-58,-22 -35,2 -15,35" fill="none" stroke="#FFFFFF" stroke-width="3"/>
      <polygon points="-2,-8 25,-48 68,-38 78,5 38,25" fill="#18181B" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>
      <polyline points="25,-48 38,-12 78,5" fill="none" stroke="#FFFFFF" stroke-width="3"/>
      <polygon points="-45,48 -32,8 18,2 38,32 5,68 -35,62" fill="#18181B" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>
      <polyline points="-32,8 -5,32 38,32" fill="none" stroke="#FFFFFF" stroke-width="3"/>
      <line x1="-5" y1="32" x2="5" y2="68" stroke="#FFFFFF" stroke-width="3"/>
      <polygon points="58,12 88,-22 118,-8 102,32 68,35" fill="#18181B" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>
      <polygon points="15,58 32,22 75,12 88,38 45,68" fill="#18181B" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>

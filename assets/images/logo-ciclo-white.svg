      <path d="M 0,-125 Q 4,-162 12,-175" fill="none" stroke="#1F8A3B" stroke-width="5" stroke-linecap="round"/>
      <path d="M 0,-115 Q 22,-145 42,-152" fill="none" stroke="#1F8A3B" stroke-width="5" stroke-linecap="round"/>


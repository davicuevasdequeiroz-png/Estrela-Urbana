      <path d="M 25,-152 C 45,-168 75,-158 65,-135 C 48,-132 32,-140 25,-152 Z" fill="#1B431C"/>
      <path d="M -115,-72 C -92,-68 -72,-48 -88,-32 C -105,-38 -115,-55 -115,-72 Z" fill="#1B431C"/>
      <path d="M -82,-78 C -58,-85 -38,-68 -52,-50 C -68,-52 -78,-65 -82,-78 Z" fill="#1B431C"/>

      <path d="M -56,-65 Q 0,-55 56,-65" fill="none" stroke="#FFFFFF" stroke-width="5"/>
      <path d="M -68,38 Q 0,48 68,38" fill="none" stroke="#FFFFFF" stroke-width="5"/>
      <line x1="-44" y1="-50" x2="-54" y2="25" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>

      <path d="M 0,25
               C -26,25 -34,-5 -15,-32
               C -5,-46 0,-58 -2,-68
               C 14,-52 22,-32 18,-15
               C 25,-22 28,-30 26,-38
               C 38,-18 28,25 0,25 Z" 

<svg xmlns="http://www.w3.org/2000/svg" viewBox="80 80 640 640" width="100%" height="100%">
  <!-- Estrela Urbana — Emblema Biociclo com fundo transparente para seções claras -->
  <g transform="translate(400, 400)">

    <g transform="translate(128, 8)">
      <polygon points="-24,-115 24,-115 54,-72 -54,-72" fill="#18181B"/>
      <ellipse cx="0" cy="-115" rx="24" ry="7" fill="#18181B" stroke="#FFFFFF" stroke-width="4"/>
      <line x1="-18" y1="-102" x2="-38" y2="-76" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>


    <g>
      <path d="M -135,-168 Q -65,-215 5,-218" fill="none" stroke="#EAB308" stroke-width="7" stroke-linecap="round"/>
      <path d="M -155,-145 Q -72,-198 5,-204" fill="none" stroke="#EAB308" stroke-width="7" stroke-linecap="round"/>
      <path d="M -125,-132 Q -58,-180 5,-190" fill="none" stroke="#EAB308" stroke-width="6" stroke-linecap="round"/>
      <polygon points="18,-238 26,-216 48,-212 30,-198 34,-175 14,-188 -6,-178 0,-200 -16,-216 6,-218" fill="#EAB308"/>

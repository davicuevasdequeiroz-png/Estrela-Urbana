        <circle cx="-6" cy="-26" r="3.5" fill="#FEF08A"/>
        <circle cx="6" cy="-26" r="3.5" fill="#FEF08A"/>
        <circle cx="-7" cy="-15" r="3.8" fill="#FEF08A"/>
        <circle cx="0" cy="-15" r="3.8" fill="#FEF08A"/>
        <circle cx="7" cy="-15" r="3.8" fill="#FEF08A"/>
        <circle cx="-8" cy="-4" r="4" fill="#FEF08A"/>
        <circle cx="0" cy="-4" r="4" fill="#FEF08A"/>
        <circle cx="8" cy="-4" r="4" fill="#FEF08A"/>
        <circle cx="-7" cy="7" r="3.8" fill="#FEF08A"/>
        <circle cx="0" cy="7" r="3.8" fill="#FEF08A"/>
        <circle cx="7" cy="7" r="3.8" fill="#FEF08A"/>
        <circle cx="-6" cy="18" r="3.5" fill="#FEF08A"/>
        <circle cx="5" cy="18" r="3.5" fill="#FEF08A"/>
